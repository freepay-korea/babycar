name: Build Android APK

# 폰에서 테스트할 APK를 만들어 Actions의 Artifacts에 올립니다.
# 사용법: GitHub → Actions → "Build Android APK" → 실행 결과 → Artifacts → bungbung-debug-apk 다운로드
on:
  push:
    branches: ['main', 'claude/**']
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Build web app
        run: npm run build

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk bungbung-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bungbung-debug-apk
          path: bungbung-debug.apk
          retention-days: 30
