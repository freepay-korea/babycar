  <!-- Bumpers & trim -->
  <rect x="58" y="318" width="396" height="18" rx="8" fill="#1e293b"/>
  
  <!-- Headlights -->
  <circle cx="430" cy="298" r="16" fill="#fef08a"/>
  <circle cx="430" cy="298" r="10" fill="#ffffff"/>
  
  <!-- Cute Eyes on Windshield -->
  <circle cx="340" cy="215" r="14" fill="#ffffff"/>
  <circle cx="344" cy="215" r="8" fill="#0f172a"/>
  <circle cx="347" cy="211" r="3" fill="#ffffff"/>

  <circle cx="270" cy="215" r="14" fill="#ffffff"/>
  <circle cx="274" cy="215" r="8" fill="#0f172a"/>
  <circle cx="277" cy="211" r="3" fill="#ffffff"/>

  <!-- Cute Smile on Hood -->
  <path d="M 370 295 Q 395 320 415 295" stroke="#7f1d1d" stroke-width="5" fill="none" stroke-linecap="round"/>
  <circle cx="365" cy="302" r="7" fill="#f43f5e" opacity="0.6"/>

  <!-- Wheels (Front & Back) -->
  <!-- Left Wheel -->
  <circle cx="160" cy="355" r="46" fill="#0f172a"/>
  <circle cx="160" cy="355" r="22" fill="#e2e8f0"/>
  <circle cx="160" cy="355" r="8" fill="#ef4444"/>

  <!-- Right Wheel -->
  <circle cx="352" cy="355" r="46" fill="#0f172a"/>
  <circle cx="352" cy="355" r="22" fill="#e2e8f0"/>
  <circle cx="352" cy="355" r="8" fill="#ef4444"/>
